sentence=Standard PLC function blocks (timers, counters, bistables, edge triggers) and string functions for Arduino.
paragraph=Portable IEC 61131-3 style function blocks: TON, TOF, TP timers, CTU, CTD, CTUD counters, RS, SR bistables, R_TRIG, F_TRIG edge detectors, and standard string functions (plc_concat, plc_find, plc_left, plc_right, plc_mid, etc.). Each block keeps its own state. Pass millis() as the current time.
